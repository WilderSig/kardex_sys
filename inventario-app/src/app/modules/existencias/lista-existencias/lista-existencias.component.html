<div class="container">
    <h2>Consulta de Existencias por Producto</h2>
    <mat-form-field class="full-width">
        <mat-label>ID del Producto</mat-label>
        <input matInput type="number" name="productoId">
    </mat-form-field>
    <button mat-raised-button color="primary"  (click)="consultarExistencias()">Consultar</button>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" *ngIf="dataSource.data.length > 0">
        <ng-container matColumnDef="bodega">
            <th mat-header-cell *matHeaderCellDef> Bodega </th>
            <td mat-cell *matCellDef="let existencia"> {{ existencia.bodega }} </td>
        </ng-container>

        <ng-container matColumnDef="cantidad">
            <th mat-header-cell *matHeaderCellDef> Cantidad </th>
            <td mat-cell *matCellDef="let existencia"> {{ existencia.cantidad }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
