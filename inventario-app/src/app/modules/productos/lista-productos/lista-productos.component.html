<div class="container">
    <h2>Lista de Productos</h2>

    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <ng-container matColumnDef="sku">
            <th mat-header-cell *matHeaderCellDef> SKU </th>
            <td mat-cell *matCellDef="let producto"> {{ producto.sku }} </td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
            <th mat-header-cell *matHeaderCellDef> Descripción </th>
            <td mat-cell *matCellDef="let producto"> {{ producto.descripcion }} </td>
        </ng-container>

        <ng-container matColumnDef="fechaVencimiento">
            <th mat-header-cell *matHeaderCellDef> Fecha de Vencimiento </th>
            <td mat-cell *matCellDef="let producto"> {{ producto.fechaVencimiento | date }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
</div>
