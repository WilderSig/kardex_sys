<div class="container">
    <h2>Lista de Movimientos</h2>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="tipoMovimiento">
            <th mat-header-cell *matHeaderCellDef> Tipo </th>
            <td mat-cell *matCellDef="let movimiento"> {{ movimiento.tipoMovimiento }} </td>
        </ng-container>

        <ng-container matColumnDef="producto">
            <th mat-header-cell *matHeaderCellDef> Producto </th>
            <td mat-cell *matCellDef="let movimiento"> {{ movimiento.producto }} </td>
        </ng-container>

        <ng-container matColumnDef="bodegaOrigen">
            <th mat-header-cell *matHeaderCellDef> Bodega Origen </th>
            <td mat-cell *matCellDef="let movimiento"> {{ movimiento.bodegaOrigen }} </td>
        </ng-container>

        <ng-container matColumnDef="bodegaDestino">
            <th mat-header-cell *matHeaderCellDef> Bodega Destino </th>
            <td mat-cell *matCellDef="let movimiento"> {{ movimiento.bodegaDestino }} </td>
        </ng-container>

        <ng-container matColumnDef="cantidad">
            <th mat-header-cell *matHeaderCellDef> Cantidad </th>
            <td mat-cell *matCellDef="let movimiento"> {{ movimiento.cantidad }} </td>
        </ng-container>

        <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef> Fecha </th>
            <td mat-cell *matCellDef="let movimiento"> {{ movimiento.fecha }} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
</div>
